name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # The core is pure logic and needs no GPU, which is the whole point:
      # every rule about residency and VRAM is verifiable on a machine that
      # has never seen a model.
      - name: test the pure crates
        run: cargo test --workspace --all-targets

      # The bindings only have to COMPILE here. They contain no rules — if a
      # binding needed its own tests, it would mean logic had leaked into it.
      - name: check bindings
        run: cargo check --workspace --all-targets

      - name: live Imagine v8 safetensors resolver smoke
        if: github.event_name == 'workflow_dispatch'
        run: cargo test -p hearth-pull registry::tests::live_imagine_v8_resolves_as_safetensors_without_downloading_weights -- --ignored --exact --nocapture

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: the A6000 case, out loud
        run: cargo run -p hearth-core --example a6000
